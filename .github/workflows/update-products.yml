name: Actualiser les produits
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run update:products
      - run: npm run check && npm test
      - name: Publier le catalogue si modifié
        run: |
          if git diff --quiet -- data/open-prices.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/open-prices.json
          git commit -m 'Refresh Open Prices catalog'
          git push
