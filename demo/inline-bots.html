const names=['Toi','Alex · bot','Jo · bot','Max · bot'];
let scores=[0,0,0,0],deck=[],round=0,phase='lobby',answers=[],botAt=[],deadline=0,timer=null;
const money=c=>new Intl.NumberFormat('fr-CA',{style:'currency',currency:'CAD'}).format(c/100);
const proximity=(g,p)=>Math.max(0,Math.round(100*(1-Math.abs(g-p)/p)));
function rows(reveal=false){return names.map((name,i)=>`<div class="row ${i===0?'you':''}"><div>${name}<small>${reveal?(answers[i]===null?'Pas de réponse':money(answers[i])):phase==='guess'?(answers[i]===null?'Réfléchit…':'✓ Prix verrouillé'):i===0?'Prêt à jouer':'Joueur simulé'}</small></div><strong>${scores[i]} pts</strong></div>`).join('');}
function lobby(){phase='lobby';screen.innerHTML=`<h1>T’as l’œil.<br>Mais as-tu le bon prix?</h1><p>5 produits · 45 secondes · $ CA avant taxes.<br>Jusqu’à 100 points de précision + 50 au plus proche.</p><div class="panel">${rows()}</div><button class="wide cursor-interaction" id="lh-start">C’est parti ↗</button>`;root.querySelector('#lh-start').onclick=start;}
function start(){clearInterval(timer);scores=[0,0,0,0];deck=[...products];for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}round=0;next();}
function next(){phase='guess';answers=[null,null,null,null];const now=Date.now();deadline=now+45000;botAt=[0,now+3500+Math.random()*3500,now+6000+Math.random()*5000,now+9000+Math.random()*6500];const p=deck[round];screen.innerHTML=`<div class="meta"><span>MANCHE ${round+1} / 5</span><strong id="lh-clock">45 s</strong></div><div class="track"><div class="fill" id="lh-fill" style="width:100%"></div></div><div class="layout"><section><div class="picture">${p.image?`<img src="${p.image}" alt="${p.name}">`:'Photo indisponible'}</div><h2>${p.name}</h2><div class="tag">VENDU PAR IKEA CANADA</div><p>${p.description}</p></section><section><div class="panel" id="lh-input"><h2>Ça coûte combien?</h2><form id="lh-form"><label for="lh-price">Ton estimation en $ CA</label><input id="lh-price" inputmode="decimal" autocomplete="off" placeholder="0,00" maxlength="12" required><button class="wide cursor-interaction">Je lock mon prix ↗</button><div class="error" id="lh-error" role="alert"></div></form></div><div class="panel" id="lh-players" aria-live="polite">${rows()}</div></section></div>`;
root.querySelector('#lh-form').onsubmit=e=>{e.preventDefault();if(phase!=='guess'||answers[0]!==null)return;if(Date.now()>=deadline){tick();return;}const raw=root.querySelector('#lh-price').value.trim().replace(',','.');if(!/^\d+(\.\d{1,2})?$/.test(raw)||Number(raw)>1000000){root.querySelector('#lh-error').textContent='Entre un prix valide, avec au plus 2 décimales.';return;}answers[0]=Math.round(Number(raw)*100);root.querySelector('#lh-input').innerHTML=`<span class="tag">✓ VERROUILLÉ</span><div class="price">${money(answers[0])}</div><p>Les autres terminent leur estimation…</p>`;tick();};clearInterval(timer);timer=setInterval(tick,200);}
function tick(){if(phase!=='guess')return;const now=Date.now(),p=deck[round];let changed=false;for(let i=1;i<4;i++){if(answers[i]===null&&now>=botAt[i]){const factor=i===1?.8+Math.random()*.4:i===2?.45+Math.random()*.8:.65+Math.random()*1.05;answers[i]=Math.max(0,Math.round(p.priceCents*factor/25)*25);changed=true;}}const left=Math.max(0,Math.ceil((deadline-now)/1000));root.querySelector('#lh-clock').textContent=left+' s';root.querySelector('#lh-fill').style.width=Math.max(0,(deadline-now)/450)+'%';if(changed||answers[0]!==null)root.querySelector('#lh-players').innerHTML=rows();if(now>=deadline||answers.every(a=>a!==null))reveal();}
function reveal(){if(phase!=='guess')return;phase='reveal';clearInterval(timer);const p=deck[round],best=Math.min(...answers.filter(a=>a!==null).map(a=>Math.abs(a-p.priceCents)));const results=names.map((name,i)=>{const closest=answers[i]!==null&&Math.abs(answers[i]-p.priceCents)===best;const points=answers[i]===null?0:proximity(answers[i],p.priceCents)+(closest?50:0);scores[i]+=points;return{name,i,closest,points};}).sort((a,b)=>b.points-a.points);screen.innerHTML=`<div class="meta"><span>MANCHE ${round+1} / 5</span><span>RÉVÉLATION</span></div><div class="panel pop" aria-live="polite"><span class="tag">${p.name}</span><div class="price">${money(p.priceCents)}</div><p>Prix du catalogue de test · avant taxes</p>${results.map(r=>`<div class="row ${r.i===0?'you':''}"><div>${r.name}<small>${answers[r.i]===null?'Aucune réponse':money(answers[r.i])+' · '+(answers[r.i]===p.priceCents?'Pile dessus':answers[r.i]<p.priceCents?'Trop bas':'Trop haut')}</small>${r.closest?'<small class="award">Au plus proche · bonus +50</small>':''}</div><strong>+${r.points}</strong></div>`).join('')}</div><button id="lh-next" class="wide cursor-interaction">${round===4?'Voir le podium':'Prochain produit →'}</button>`;root.querySelector('#lh-next').onclick=()=>{round++;if(round===5)finish();else next();};}
function finish(){phase='finished';const ranking=names.map((name,i)=>({name,i,score:scores[i]})).sort((a,b)=>b.score-a.score),winners=ranking.filter(p=>p.score===ranking[0].score);screen.innerHTML=`<h1 class="pop">${winners.some(p=>p.i===0)?'À toi la gloire!':'La caisse a parlé.'}</h1><p>${winners.map(p=>p.name).join(' et ')} · ${winners.length>1?'victoire partagée':'victoire'}</p><div class="panel">${ranking.map(p=>`<div class="row ${p.i===0?'you':''}"><span>${1+ranking.filter(q=>q.score>p.score).length}. ${p.name}</span><strong>${p.score} pts</strong></div>`).join('')}</div><button id="lh-again" class="wide cursor-interaction">La revanche? ↻</button>`;root.querySelector('#lh-again').onclick=start;}
lobby();
})();
</script>
